rules:
  - id: scout.hardcoded-secret.assignment
    languages: [python]
    severity: ERROR
    message: >-
      A credential-looking variable is assigned a string literal. Secrets in source end up in git history.
    patterns:
      - pattern: $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|pwd|secret|api_?key|token|access_?key|private_?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^[^\s]{8,}$
    metadata:
      category: hardcoded-secret
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      remediation: Secret/env migration
      fix: >-
        Move the value to an environment variable or secrets manager and read it at runtime, e.g.
        os.environ["NAME"]. Then rotate the exposed secret, since it is already in version control.

  - id: scout.hardcoded-secret.aws-access-key
    languages: [generic]
    severity: ERROR
    message: A string shaped like an AWS access key id is present in the source.
    pattern-regex: \bAKIA[0-9A-Z]{16}\b
    metadata:
      category: hardcoded-secret
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      remediation: Secret/env migration
      fix: >-
        Remove the key, load credentials from the environment or an IAM role, and rotate this key.
